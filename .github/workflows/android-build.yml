name: Android build

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "www/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Write keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=app/upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build signed AAB (for Play Store)
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Build signed APK (for manual install/testing)
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Remove signing material from runner
        if: always()
        run: rm -f android/app/upload-keystore.jks android/keystore.properties

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: waxpro-manager-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: waxpro-manager-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
